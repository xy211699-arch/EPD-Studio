name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Python tests
        run: python -m unittest discover -s web-epd/tests -p 'test_*.py' -v
      - name: Node tests
        run: node --test web-epd/tests/*.test.mjs
      - name: Syntax checks
        shell: pwsh
        run: |
          python -m compileall -q web-epd
          node --check web-epd/js/main.js
          node --check web-epd/js/static-dashboard.js
